name: Horaires

on:
  schedule:
    # La source (opentransportdata.swiss) publie le mercredi et le samedi matin.
    - cron: "0 10 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetable
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger les GTFS
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/gtfs"
          year=$(date +%Y)
          next=$((year + 1))
          base=https://data.opentransportdata.swiss/de/dataset
          curl -fsSL -o "$RUNNER_TEMP/gtfs/current.zip" "$base/timetable-$year-gtfs2020/permalink"
          args="--gtfs $RUNNER_TEMP/gtfs/current.zip"
          # Le jeu de l'année suivante n'existe pas toujours : seul un HTTP 404 signifie « absent ».
          # Toute autre erreur (réseau, 5xx, curl) fait échouer le job.
          code=$(curl -sSL -w '%{http_code}' -o "$RUNNER_TEMP/gtfs/next.zip" "$base/timetable-$next-gtfs2020/permalink")
          if [ "$code" = "200" ]; then
            args="$args --gtfs $RUNNER_TEMP/gtfs/next.zip"
          elif [ "$code" = "404" ]; then
            echo "Pas de jeu GTFS $next (404), on continue avec $year seul."
            rm -f "$RUNNER_TEMP/gtfs/next.zip"
          else
            echo "Réponse inattendue ($code) pour le jeu GTFS $next" >&2
            exit 1
          fi
          echo "GTFS_ARGS=$args" >> "$GITHUB_ENV"

      - name: Tests
        run: python -I -m unittest discover -s pipeline

      - name: Construire la base
        run: |
          python -I pipeline/build_timetable.py $GTFS_ARGS \
            --lines pipeline/lines.json --out timetable.db --version-out version.json
          cat version.json
          ls -l timetable.db

      - name: Refuser une base plus ancienne que celle publiée
        run: |
          set -eu
          url="https://github.com/${{ github.repository }}/releases/download/timetable/version.json"
          code=$(curl -sSL -w '%{http_code}' -o "$RUNNER_TEMP/published.json" "$url")
          if [ "$code" = "404" ]; then
            echo "Rien de publié pour l'instant : on publie."
            exit 0
          fi
          [ "$code" = "200" ] || { echo "Lecture de la version publiée impossible ($code)" >&2; exit 1; }
          python -I - "$RUNNER_TEMP/published.json" version.json <<'PY'
          import json, sys
          old = json.load(open(sys.argv[1], encoding="utf-8"))["valid_to"]
          new = json.load(open(sys.argv[2], encoding="utf-8"))["valid_to"]
          print("valid_to publiée", old, "nouvelle", new)
          if new < old:
              sys.exit("Refus : la nouvelle base finit avant la base publiée")
          PY

      - name: Publier la release
        run: |
          gh release create timetable --title "Horaires" \
            --notes "Base d'horaires reconstruite le mercredi et le samedi." || true
          gh release upload timetable timetable.db version.json --clobber
